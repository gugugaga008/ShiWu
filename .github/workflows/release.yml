name: release
# 推送 v* 标签或手动触发：三平台各自构建 Python 服务（PyInstaller，不能交叉编译）+ Electron 安装包
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: win
          - os: macos-14          # arm64
            target: mac
          - os: macos-13          # x64
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk libfuse2 xz-utils rpm

      - name: Python 依赖 + 测试
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q

      - name: 前端
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Python 服务 → 独立可执行文件
        run: pyinstaller packaging/shiwu.spec --noconfirm --distpath dist --workpath build/pyi

      - name: Electron 安装包
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未配置签名证书时跳过签名；配置 CSC_LINK / APPLE_ID 等 secrets 后自动签名/公证
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm install --frozen-lockfile
          ARCH=$([ "$(uname -m)" = "arm64" ] && echo --arm64 || echo --x64)
          case "${{ matrix.target }}" in
            linux) npx electron-builder --linux AppImage deb --x64 --publish never ;;
            win)   npx electron-builder --win nsis --x64 --publish never ;;
            mac)   npx electron-builder --mac dmg $ARCH --publish never ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: shiwu-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
