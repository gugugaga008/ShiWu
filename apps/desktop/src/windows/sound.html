<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file:; script-src 'unsafe-inline'"></head><body>
<script>const q=new URLSearchParams(location.search);const a=new Audio(q.get('src'));a.volume=Number(q.get('v')||1);a.play().then(()=>{document.title='ok'}).catch((e)=>{console.error('[sound] play failed',e);document.title='fail';window.close()});a.onended=()=>window.close()</script>
</body></html>
