<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>body{margin:0;font:14px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:transparent}
.box{margin:8px;background:#1c1917;color:#fff;border-left:6px solid #dc2626;border-radius:10px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.t{font-weight:700;font-size:16px;margin-bottom:4px}.b{opacity:.9}.app{font-size:11px;opacity:.6;margin-bottom:6px}</style></head>
<body><div class="box"><div class="app">识务 · 通知</div><div class="t" id="t"></div><div class="b" id="b"></div></div>
<script>const q=new URLSearchParams(location.search);document.getElementById('t').textContent=q.get('title');document.getElementById('b').textContent=q.get('body')</script>
</body></html>
