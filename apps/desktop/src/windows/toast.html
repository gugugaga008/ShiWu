<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>body{margin:0;font:14px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:transparent}
.box{margin:8px;background:#18181b;color:#fafafa;border:1px solid #3f3f46;border-left:6px solid #f59e0b;border-radius:12px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.app{font-size:11px;letter-spacing:.04em;color:#a1a1aa;margin-bottom:4px}
.time{font:12px ui-monospace,Menlo,monospace;color:#fbbf24;margin-bottom:6px}
.t{font-weight:700;font-size:16px;margin-bottom:4px}.b{color:#e4e4e7;line-height:1.4}</style></head>
<body><div class="box"><div class="app">识务 · 通知</div><div class="time" id="time"></div><div class="t" id="t"></div><div class="b" id="b"></div></div>
<script>const q=new URLSearchParams(location.search);document.getElementById('t').textContent=q.get('title');document.getElementById('b').textContent=q.get('body');document.getElementById('time').textContent=q.get('time')||''</script>
</body></html>
